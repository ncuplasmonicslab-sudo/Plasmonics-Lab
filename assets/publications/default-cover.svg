<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Plasmonics Laboratory publication cover</title>
  <desc id="desc">Default cover for a publication without a verified image.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f33"/>
      <stop offset="1" stop-color="#173f5f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f0c36b" stop-opacity=".92"/>
      <stop offset=".35" stop-color="#d7943e" stop-opacity=".38"/>
      <stop offset="1" stop-color="#d7943e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#background)"/>
  <circle cx="910" cy="220" r="245" fill="url(#glow)"/>
  <g fill="none" stroke="#f0c36b" stroke-opacity=".55">
    <circle cx="910" cy="220" r="64" stroke-width="4"/>
    <circle cx="910" cy="220" r="116" stroke-width="3"/>
    <circle cx="910" cy="220" r="172" stroke-width="2"/>
  </g>
  <path d="M650 410C770 330 930 330 1080 430" fill="none" stroke="#c9e4f5" stroke-opacity=".7" stroke-width="5"/>
  <path d="M650 450C780 370 950 370 1080 470" fill="none" stroke="#c9e4f5" stroke-opacity=".35" stroke-width="3"/>
  <text x="90" y="270" fill="#f4f7fa" font-family="Arial, sans-serif" font-size="64" font-weight="700">PLASMONICS</text>
  <text x="90" y="340" fill="#f0c36b" font-family="Arial, sans-serif" font-size="42" letter-spacing="5">LABORATORY</text>
  <rect x="90" y="390" width="270" height="4" fill="#f0c36b"/>
  <text x="90" y="455" fill="#c9e4f5" font-family="Arial, sans-serif" font-size="28">Publication image pending verification</text>
</svg>
